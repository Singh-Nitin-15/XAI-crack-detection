services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crackdb
      POSTGRES_USER: crackuser
      POSTGRES_PASSWORD: crackpass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crackuser -d crackdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://crackuser:crackpass123@postgres:5432/crackdb
      STORAGE_TYPE: local
      STORAGE_DIR: /app/storage
      TEMP_DIR: /tmp/xai
      PORT: "8000"
      CRACK_THRESHOLD: "0.5"
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  storage_data:
